<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting to Admin...</title>
  <script>
    // Redirect dynamically to support both root domains (Vercel) and repository subfolders (GitHub Pages)
    const basePath = window.location.pathname.replace(/\/admin(\/)?$/, '');
    window.location.replace((basePath || '/') + '#admin');
  </script>
</head>
<body>
  <p>Redirecting to Admin Dashboard...</p>
</body>
</html>
